<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exhibitor registration demo – ShowLeaders</title>
<meta name="description" content="Try ShowLeaders exhibitor registration: reserve tanks on the show floor map, register fish, add photos, and see dealer and vendor options. Sample data. Nothing is saved or sent.">
<meta name="theme-color" content="#084868">
<link rel="canonical" href="https://showleaders.com/demo/registration/">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ShowLeaders">
<meta property="og:title" content="Exhibitor registration demo – ShowLeaders">
<meta property="og:description" content="Try ShowLeaders exhibitor registration: reserve tanks on the show floor map, register fish, add photos, and see dealer and vendor options. Sample data. Nothing is saved or sent.">
<meta property="og:url" content="https://showleaders.com/demo/registration/">
<meta property="og:image" content="https://showleaders.com/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=1">
<style>
  .demo-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .35rem .9rem; padding: .55rem .9rem; background: #084868; color: #fff; font: 600 .85rem/1.35 Manrope, system-ui, sans-serif; text-align: center; }
  .demo-bar a { color: #ffd2b0; font-weight: 700; }
  .demo-bar button { font: inherit; font-weight: 700; color: #084868; background: #fff; border: 0; border-radius: 999px; padding: .3rem .8rem; cursor: pointer; }
  .demo-tag { background: #F26B1D; color: #fff; border-radius: 999px; padding: .1rem .6rem; font-weight: 800; letter-spacing: .04em; }
  .demo-hint { margin: 0; padding: .45rem 1rem; text-align: center; font: 500 .8rem/1.35 Manrope, system-ui, sans-serif; color: #555; background: #fff7ee; border-bottom: 1px solid #f0d9c2; }

  .demo-who { display: inline-flex; gap: .25rem; flex-wrap: wrap; justify-content: center; }
  .demo-who button { background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
  .demo-who button[aria-pressed="true"] { background: #fff; color: #084868; }
</style>
</head>
<body>
<div class="demo-bar" role="note">
  <span><span class="demo-tag">DEMO</span> Nothing is saved or sent.</span>
  <span class="demo-who" role="group" aria-label="Try as">
    <span>Try as:</span>
    <button type="button" data-who="exhibitor">Exhibitor</button>
    <button type="button" data-who="dealer">Dealer</button>
    <button type="button" data-who="vendor">Vendor</button>
    <button type="button" data-who="new">First visit</button>
  </span>
  <button type="button" id="demo-reset">Reset demo</button>
  <a href="mailto:Info@showleaders.com?subject=ShowLeaders%20registration%20demo">Email us</a>
  <a href="/demo/">More demos</a>
</div>
<p class="demo-hint" id="demo-hint"></p>
<div id="root"></div>
<noscript><p style="padding:1rem">This demo needs JavaScript turned on.</p></noscript>
<script>
  window.__CFG__ = { params: { showId: "8" }, pathname: "/demo/registration/shows/8/register" };
  var HINTS = {
    exhibitor: "You are Pat Sample, a public exhibitor with one tank and two fish. Click a tank on the map to reserve it, add a fish, attach a photo. Tip: tap “I’m a dealer” and enter the PIN DEALER, then “I’m a vendor” with the PIN VENDOR.",
    dealer: "You are Pat Sample, a dealer with two tanks. Dealers can register fish for their customers (choose an Owner, or add a new person). Tip: try the PIN VENDOR in the vendor box.",
    vendor: "You are Pat Sample, a dealer and vendor. Vendors choose a Dealer or Vendor kind for each tank, and get some Dealer tanks included.",
    "new": "First visit: enter any made-up name and email address. Nothing leaves your device."
  };
  function who() { var h = (location.hash || "").replace("#", ""); return HINTS[h] ? h : "exhibitor"; }
  function paint() {
    var w = who();
    document.getElementById("demo-hint").textContent = HINTS[w];
    [].forEach.call(document.querySelectorAll("[data-who]"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-who") === w)); });
  }
  paint();
  [].forEach.call(document.querySelectorAll("[data-who]"), function (b) {
    b.addEventListener("click", function () { location.hash = b.getAttribute("data-who"); location.reload(); });
  });
  document.getElementById("demo-reset").addEventListener("click", function () { location.reload(); });
</script>
<script src="app.js?v=1"></script>
</body>
</html>
